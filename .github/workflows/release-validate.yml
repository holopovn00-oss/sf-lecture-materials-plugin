name: Release validation

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  release-validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: wtfjoke/setup-tectonic@v4
        with:
          tectonic-version: "0.17.0"
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Prime isolated TeX cache
        run: |
          set -euo pipefail
          export SF_TECTONIC_CACHE="$RUNNER_TEMP/sf-tectonic-cache"
          python plugins/sf-lecture-materials/scripts/latex_math.py \
            --latex '\mathrm{EAR}=\left(1+\frac{r}{m}\right)^m-1' \
            --mode display --size 9.5 \
            --out "$RUNNER_TEMP/sf-math-warmup" --allow-downloads
      - name: Run complete release gate
        run: |
          set -euo pipefail
          export SF_RELEASE_VALIDATION=1
          export SF_TECTONIC_CACHE="$RUNNER_TEMP/sf-tectonic-cache"
          python -m compileall -q plugins tests
          python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/unittest.log"
          if grep -Eiq '(^|[[:space:]])skipped([[:space:]]|$)' "$RUNNER_TEMP/unittest.log"; then
            echo "Release validation may not contain skipped tests."
            exit 1
          fi
          python plugins/sf-lecture-materials/skills/sf-lecture-to-golden-pdf/scripts/verify_bundle.py
