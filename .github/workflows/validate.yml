name: Validate current plugin
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q plugins tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check pinned resources
        run: python plugins/sf-lecture-materials/skills/sf-lecture-to-golden-pdf/scripts/verify_bundle.py
