interface:
  display_name: "SF Fact Check"
  short_description: "Только доказанные фактические ошибки в лекции"
  default_prompt: "Используй $sf-fact-check. Выведи только доказанные фактические ошибки: точную цитату, исправление и источник либо расчёт. При пустом списке дай краткий результат проверки. Не переходи к PDF автоматически."
policy:
  allow_implicit_invocation: false
