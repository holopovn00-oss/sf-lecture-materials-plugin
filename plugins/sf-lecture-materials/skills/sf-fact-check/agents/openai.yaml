interface:
  display_name: "SF Fact Check"
  short_description: "Фактчек с action-карточками и решениями человека"
  default_prompt: "Используй $sf-fact-check: проверь утверждения этого текста по нормативам, документации и академическим источникам. Сохрани полный fact-check.json, а в чат выведи только action-карточки реальных ошибок и существенных оговорок; дождись моих решений. Не переходи к PDF автоматически."
policy:
  allow_implicit_invocation: false
