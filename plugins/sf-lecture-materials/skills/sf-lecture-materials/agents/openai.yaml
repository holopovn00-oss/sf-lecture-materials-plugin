interface:
  display_name: "SF Lecture Materials: полный цикл"
  short_description: "Материалы → текст → фактчек → PDF-кандидат"
  default_prompt: "Используй $sf-lecture-materials: проведи полный цикл по добавленным материалам. Если материалов нет, попроси прикрепить их; затем подготовь учебный текст, проведи фактчек с решениями человека и переходи к PDF только после успешного full-cycle gate. Отдельный этап выполняется только по явному вызову специализированного навыка."
policy:
  allow_implicit_invocation: true
